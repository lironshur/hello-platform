apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lironshur/hello-platform
    targetRevision: HEAD
    path: charts/hello-app
    helm:
      valueFiles:
        - values-dev-frontend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
