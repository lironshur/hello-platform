# dev frontend — re-generate with: cd envs/dev/frontend && terragrunt apply

replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

name: frontend
args: []

service:
  type: NodePort
  port: 80
  nodePort: 30081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

networkPolicy:
  enabled: true
  ingressFromApp: ""

# JS fetches /api which nginx proxies to the backend — browser never calls backend directly
html: |
  <!DOCTYPE html>
  <html>
    <body>
      <h1 id="message">Loading...</h1>
      <script>
        fetch('/api')
          .then(r => r.text())
          .then(text => document.getElementById('message').textContent = text.trim())
          .catch(() => document.getElementById('message').textContent = 'error connecting to backend')
      </script>
    </body>
  </html>

# proxy /api to the backend service so the browser never talks to it directly
nginxConf: |
  server {
    listen 80;
    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
    location /api {
      proxy_pass http://backend:5678;
    }
  }
