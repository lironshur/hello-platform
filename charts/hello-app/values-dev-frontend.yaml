# dev frontend — re-generate with: cd envs/dev/frontend && terragrunt apply

replicaCount: 1

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

name: frontend
args: []

html: |
  <!DOCTYPE html>
  <html>
    <body>
      <h1>Hello World</h1>
      <p>dev environment</p>
    </body>
  </html>

service:
  type: NodePort
  port: 80
  nodePort: 30081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

networkPolicy:
  enabled: true
  ingressFromApp: ""
