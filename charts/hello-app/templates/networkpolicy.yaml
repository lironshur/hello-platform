apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  # applies this policy to pods with this app label
  podSelector:
    matchLabels:
      app: {{ .Values.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if eq .Values.name "backend" }}
    # backend: only allow traffic from the frontend pod — nothing else can reach it directly
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- else }}
    # frontend: allow ingress from anywhere so the browser can reach it
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}
  # allow all egress so pods can reach DNS and other services
  egress:
    - {}
