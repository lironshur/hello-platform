{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.nameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.nameOverride }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.nameOverride }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # if ingressFromApp is set, only allow traffic from that specific app
    # this is used to restrict the backend so only the frontend can reach it
    {{- if .Values.networkPolicy.ingressFromApp }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.networkPolicy.ingressFromApp }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- else }}
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- end }}
  # allow all egress so pods can reach DNS, other services, etc.
  egress:
    - {}
{{- end }}
