apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  # frontend is exposed via NodePort so the browser can reach it directly
  # backend only needs to be reachable from within the cluster
  type: {{ if eq .Values.name "frontend" }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.name "frontend" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: {{ .Values.name }}
