{{- if .Values.html }}
# only created when html value is set — used to serve a custom index.html via nginx
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-html
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
data:
  index.html: |
    {{ .Values.html | nindent 4 }}
{{- end }}
