{{- if eq .Values.name "frontend" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1 id="message">Loading...</h1>
        <script>
          fetch('/api')
            .then(r => r.text())
            .then(text => document.getElementById('message').textContent = text.trim())
            .catch(() => document.getElementById('message').textContent = 'error connecting to backend')
        </script>
      </body>
    </html>
  # proxies /api to the backend so the browser never talks to it directly
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /api {
        proxy_pass http://backend:5678;
      }
    }
{{- end }}
