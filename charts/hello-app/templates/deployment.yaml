apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # args are only needed for images like http-echo that require flags to run
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            # naming the port lets the service and probes reference it by name
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # readiness probe tells k8s when the pod is ready to serve traffic
          # without this, requests can hit the pod before it's actually up
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.html .Values.nginxConf }}
          volumeMounts:
            {{- if .Values.html }}
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            {{- end }}
            {{- if .Values.nginxConf }}
            # replaces the default nginx config to enable the /api proxy
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- end }}
          {{- end }}
      {{- if or .Values.html .Values.nginxConf }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
      {{- end }}
