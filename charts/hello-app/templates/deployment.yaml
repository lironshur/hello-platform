apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.nameOverride }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.nameOverride }}
    spec:
      containers:
        - name: {{ .Values.nameOverride }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # args are only needed for images like http-echo that require flags to run
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            # naming the port lets the service and probes reference it by name
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # readiness probe tells k8s when the pod is ready to serve traffic
          # without this, requests can hit the pod before it's actually up
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # only mount the html volume if custom content was provided (frontend only)
          {{- if .Values.html }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          {{- end }}
      {{- if .Values.html }}
      volumes:
        - name: html
          configMap:
            name: {{ .Values.nameOverride }}-html
      {{- end }}
