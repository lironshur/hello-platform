apiVersion: apps/v1
kind: Deployment
metadata:
  # name and namespace come from the values file — same template serves frontend and backend
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # backend (http-echo) requires flags to set the response text and listen port
          {{- if eq .Values.name "backend" }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          ports:
            # naming the port lets the service and readiness probe reference it by name
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # tells k8s when the pod is ready to receive traffic — without this,
          # requests can hit the pod before the server is actually up
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # toYaml serializes the resources object and nindent aligns it under resources:
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # frontend only — mounts the custom HTML page and nginx config from the ConfigMap
          {{- if eq .Values.name "frontend" }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            # overrides the default nginx config to add the /api proxy_pass rule
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          {{- end }}
      # frontend only — the ConfigMap holding index.html and default.conf
      {{- if eq .Values.name "frontend" }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}-config
      {{- end }}
