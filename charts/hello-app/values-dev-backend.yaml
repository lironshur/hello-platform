"args":
- "-text=hello world"
- "-listen=:5678"
"image":
  "pullPolicy": "IfNotPresent"
  "repository": "hashicorp/http-echo"
  "tag": "latest"
"name": "backend"
"networkPolicy":
  "enabled": true
  "ingressFromApp": "frontend"
"replicaCount": 1
"resources":
  "limits":
    "cpu": "100m"
    "memory": "64Mi"
  "requests":
    "cpu": "50m"
    "memory": "32Mi"
"service":
  "nodePort": 30082
  "port": 5678
  "type": "NodePort"
