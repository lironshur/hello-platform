name: Helm Lint

on:
  push:
    paths:
      - "charts/**"
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Lint default values
        run: helm lint charts/hello-app

      - name: Lint with dev values
        run: helm lint charts/hello-app -f charts/hello-app/values-dev.yaml

      - name: Lint with staging values
        run: helm lint charts/hello-app -f charts/hello-app/values-staging.yaml
