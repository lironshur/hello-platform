name: Helm Lint

on:
  push:
    paths:
      - "charts/**"
  pull_request:
    paths:
      - "charts/**"

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      # lint with defaults first, then with each env values file to catch overrides
      - name: Lint default values
        run: helm lint charts/hello-app

      - name: Lint dev frontend
        run: helm lint charts/hello-app -f charts/hello-app/values-dev-frontend.yaml

      - name: Lint dev backend
        run: helm lint charts/hello-app -f charts/hello-app/values-dev-backend.yaml

      - name: Lint staging frontend
        run: helm lint charts/hello-app -f charts/hello-app/values-staging-frontend.yaml

      - name: Lint staging backend
        run: helm lint charts/hello-app -f charts/hello-app/values-staging-backend.yaml
